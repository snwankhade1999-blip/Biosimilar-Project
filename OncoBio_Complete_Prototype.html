<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<title>OncoBio Global | Anticancer Biosimilar Business Plan 2025–2032</title>

<meta property="og:title" content="OncoBio Global — Anticancer Biosimilar Business Plan"/>
<meta property="og:description" content="$18B → $45B market. 6 molecules. 7 countries. Near-zero tariff. 2025–2032 strategy."/>
<meta property="og:type" content="website"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#070A0F;color:#D8EAF8;font-family:'Outfit',sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:rgba(59,158,255,0.3);border-radius:3px}
::-webkit-scrollbar-track{background:#0C1118}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes scanLine{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(59,158,255,.3)}50%{box-shadow:0 0 40px rgba(59,158,255,.6)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes countUp{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

.fade-up{animation:fadeUp .7s ease both}
.fade-up-d1{animation:fadeUp .7s .1s ease both}
.fade-up-d2{animation:fadeUp .7s .2s ease both}
.fade-up-d3{animation:fadeUp .7s .3s ease both}
.fade-up-d4{animation:fadeUp .7s .4s ease both}
.fade-in{animation:fadeIn .5s ease both}

/* ── Glassmorphism card ── */
.glass{background:rgba(16,24,32,0.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.07)}

/* ── Gradient text ── */
.grad-text{background:linear-gradient(135deg,#3B9EFF,#00D4C8,#00E27A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.grad-text-amber{background:linear-gradient(135deg,#FFB020,#FF5050);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ── Grid background ── */
.grid-bg{background-image:linear-gradient(rgba(59,158,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(59,158,255,.04) 1px,transparent 1px);background-size:40px 40px}

/* ── Hover effects ── */
.hover-lift{transition:transform .25s ease,box-shadow .25s ease}
.hover-lift:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.4)}
.hover-glow{transition:box-shadow .25s ease,border-color .25s ease}

/* ── Nav ── */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:64px;background:rgba(7,10,15,.9);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav-inner{max-width:1320px;margin:0 auto;height:100%;display:flex;align-items:center;padding:0 24px;gap:32px}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#FF5050,#A78BFA);display:flex;align-items:center;justify-content:center;font-size:19px}
.nav-logo-text{font-weight:900;font-size:16px;letter-spacing:.5px;color:#D8EAF8}
.nav-logo-sub{font-size:9px;color:rgba(216,234,248,.4);letter-spacing:1.5px}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-link{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;color:rgba(216,234,248,.55);cursor:pointer;border:none;background:transparent;font-family:'Outfit',sans-serif;transition:all .2s;text-decoration:none}
.nav-link:hover,.nav-link.active{color:#3B9EFF;background:rgba(59,158,255,.1)}
.nav-cta{padding:8px 18px;border-radius:9px;background:linear-gradient(135deg,#3B9EFF,#00D4C8);color:#070A0F;font-weight:800;font-size:12px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;letter-spacing:.3px;transition:opacity .2s}
.nav-cta:hover{opacity:.85}

/* ── Hero ── */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 24px 60px;position:relative;overflow:hidden}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;background:rgba(59,158,255,.1);border:1px solid rgba(59,158,255,.25);font-size:11px;font-weight:700;color:#3B9EFF;letter-spacing:.8px;margin-bottom:24px}
.hero-badge-dot{width:6px;height:6px;border-radius:50%;background:#3B9EFF;animation:pulse 2s infinite}
.hero-title{font-size:clamp(36px,6vw,72px);font-weight:900;line-height:1.08;text-align:center;max-width:900px;margin-bottom:20px;letter-spacing:-1px}
.hero-sub{font-size:clamp(14px,2vw,18px);color:rgba(216,234,248,.6);text-align:center;max-width:680px;line-height:1.75;margin-bottom:40px}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:60px}
.btn-primary{padding:14px 32px;border-radius:12px;background:linear-gradient(135deg,#3B9EFF,#00D4C8);color:#070A0F;font-weight:800;font-size:14px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;letter-spacing:.3px;transition:all .2s;text-decoration:none;display:inline-block}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(59,158,255,.35)}
.btn-secondary{padding:14px 32px;border-radius:12px;background:rgba(255,255,255,.05);color:#D8EAF8;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.12);cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;text-decoration:none;display:inline-block}
.btn-secondary:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}

/* ── Stats bar ── */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;max-width:900px;width:100%;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.stat-item{padding:20px 16px;background:rgba(12,17,24,.8);text-align:center;border-right:1px solid rgba(255,255,255,.07)}
.stat-item:last-child{border-right:none}
.stat-val{font-family:'Fira Code',monospace;font-size:22px;font-weight:700;margin-bottom:4px}
.stat-lbl{font-size:9px;color:rgba(216,234,248,.4);letter-spacing:1.4px;text-transform:uppercase}

/* ── Sections ── */
section{padding:80px 24px;max-width:1320px;margin:0 auto}
.section-tag{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.section-title{font-size:clamp(26px,4vw,42px);font-weight:900;line-height:1.15;margin-bottom:16px}
.section-sub{font-size:15px;color:rgba(216,234,248,.55);line-height:1.75;max-width:600px;margin-bottom:48px}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(59,158,255,.2),transparent);margin:0 24px}

/* ── Feature cards ── */
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.feature-card{padding:24px;border-radius:16px;border:1px solid rgba(255,255,255,.07);background:rgba(16,24,32,.6);transition:all .25s;cursor:default;position:relative;overflow:hidden}
.feature-card:hover{border-color:rgba(59,158,255,.3);background:rgba(16,24,32,.9);transform:translateY(-3px)}
.feature-card-num{font-family:'Fira Code',monospace;font-size:36px;font-weight:700;opacity:.12;position:absolute;top:12px;right:16px;line-height:1}
.feature-icon{font-size:28px;margin-bottom:14px}
.feature-title{font-size:15px;font-weight:800;margin-bottom:8px}
.feature-desc{font-size:12px;color:rgba(216,234,248,.5);line-height:1.7}

/* ── Molecule pills ── */
.molecule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.molecule-card{padding:20px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:rgba(16,24,32,.6);transition:all .25s}
.molecule-card:hover{transform:translateY(-3px);background:rgba(16,24,32,.9)}

/* ── Market cards ── */
.market-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.market-card{padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:rgba(16,24,32,.6);transition:all .25s}
.market-card:hover{transform:translateY(-3px)}

/* ── App section ── */
.app-section{background:rgba(12,17,24,.5);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);padding:0}
.app-header{padding:40px 24px 0;max-width:1320px;margin:0 auto;text-align:center}
.app-container{max-width:1320px;margin:0 auto;padding:24px}

/* ── App tabs ── */
.tab-bar{display:flex;gap:0;background:#0C1118;border-bottom:1px solid rgba(255,255,255,.06);overflow-x:auto;flex-shrink:0}
.tab-btn{padding:11px 14px;border:none;cursor:pointer;background:transparent;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap;transition:all .2s;flex-shrink:0;border-bottom:2px solid transparent}
.app-card{background:#101820;border:1px solid rgba(255,255,255,.06);border-radius:13px;padding:16px 18px;margin-bottom:14px}

/* ── Timeline ── */
.timeline{position:relative;padding-left:40px}
.timeline::before{content:'';position:absolute;left:15px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,#3B9EFF,#00D4C8,#00E27A)}
.timeline-item{position:relative;margin-bottom:32px}
.timeline-dot{position:absolute;left:-33px;top:4px;width:18px;height:18px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;background:#0C1118}

/* ── Footer ── */
footer{background:#070A0F;border-top:1px solid rgba(255,255,255,.06);padding:48px 24px 24px}
.footer-inner{max-width:1320px;margin:0 auto}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
.footer-logo{font-weight:900;font-size:18px;margin-bottom:10px}
.footer-desc{font-size:12px;color:rgba(216,234,248,.4);line-height:1.75;max-width:280px}
.footer-col-title{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(216,234,248,.4);margin-bottom:16px}
.footer-link{display:block;font-size:12px;color:rgba(216,234,248,.55);margin-bottom:8px;text-decoration:none;transition:color .2s;cursor:pointer}
.footer-link:hover{color:#3B9EFF}
.footer-bottom{border-top:1px solid rgba(255,255,255,.06);padding-top:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.footer-copy{font-size:11px;color:rgba(216,234,248,.25)}

/* ── Responsive ── */
@media(max-width:900px){
  .footer-grid{grid-template-columns:1fr 1fr}
  .nav-links{display:none}
  .hero-title{font-size:36px}
}
@media(max-width:600px){
  .footer-grid{grid-template-columns:1fr}
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .stat-item{border-bottom:1px solid rgba(255,255,255,.07)}
}

/* ── AUTH SCREEN ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#070A0F;position:relative;overflow:hidden}
.auth-bg-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.auth-card{width:100%;max-width:440px;background:rgba(16,24,32,0.85);backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,0.09);border-radius:22px;padding:40px;position:relative;z-index:1}
.auth-logo{display:flex;align-items:center;gap:11px;margin-bottom:32px;justify-content:center}
.auth-logo-icon{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#FF5050,#A78BFA);display:flex;align-items:center;justify-content:center;font-size:22px}
.auth-tabs{display:flex;background:#0C1118;border-radius:11px;padding:4px;gap:4px;margin-bottom:28px}
.auth-tab{flex:1;padding:9px;border-radius:8px;border:none;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.auth-tab.active{background:linear-gradient(135deg,#3B9EFF,#00D4C8);color:#070A0F}
.auth-tab:not(.active){background:transparent;color:rgba(216,234,248,.4)}
.auth-field{margin-bottom:16px}
.auth-label{font-size:11px;font-weight:700;letter-spacing:.8px;color:rgba(216,234,248,.5);margin-bottom:6px;display:block;text-transform:uppercase}
.auth-input{width:100%;padding:12px 15px;background:rgba(12,17,24,.9);border:1px solid rgba(255,255,255,.09);border-radius:10px;color:#D8EAF8;font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.auth-input:focus{border-color:rgba(59,158,255,.5)}
.auth-input::placeholder{color:rgba(216,234,248,.25)}
.auth-btn{width:100%;padding:13px;border-radius:11px;background:linear-gradient(135deg,#3B9EFF,#00D4C8);color:#070A0F;font-weight:800;font-size:14px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;margin-top:6px;transition:opacity .2s;letter-spacing:.3px}
.auth-btn:hover{opacity:.85}
.auth-demo{display:flex;gap:8px;margin-top:14px}
.auth-demo-btn{flex:1;padding:9px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:rgba(216,234,248,.55);font-size:11px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;letter-spacing:.3px}
.auth-demo-btn:hover{background:rgba(255,255,255,.09);color:#D8EAF8}
.auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:rgba(216,234,248,.2);font-size:11px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07)}
.auth-error{background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.3);border-radius:8px;padding:10px 13px;font-size:12px;color:#FF5050;margin-bottom:14px}
.auth-success{background:rgba(0,226,122,.1);border:1px solid rgba(0,226,122,.3);border-radius:8px;padding:10px 13px;font-size:12px;color:#00E27A;margin-bottom:14px}

/* ── DASHBOARD ── */
.dash-wrap{min-height:100vh;background:#070A0F;padding-top:64px}
.dash-content{max-width:1320px;margin:0 auto;padding:40px 24px}
.dash-header{margin-bottom:36px}
.dash-greeting{font-size:26px;font-weight:900;margin-bottom:6px}
.dash-sub{font-size:14px;color:rgba(216,234,248,.45)}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:32px}
.dash-kpi{padding:20px;border-radius:15px;background:rgba(16,24,32,.7);border:1px solid rgba(255,255,255,.07);transition:all .25s;cursor:default}
.dash-kpi:hover{transform:translateY(-3px);border-color:rgba(59,158,255,.25)}
.dash-kpi-icon{font-size:22px;margin-bottom:10px}
.dash-kpi-val{font-family:'Fira Code',monospace;font-size:22px;font-weight:700;margin-bottom:4px}
.dash-kpi-lbl{font-size:10px;color:rgba(216,234,248,.4);letter-spacing:1px;text-transform:uppercase}
.dash-kpi-chg{font-size:10px;font-weight:700;margin-top:6px}
.dash-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.dash-card{background:rgba(16,24,32,.7);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:20px}
.dash-card-title{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:rgba(216,234,248,.4);margin-bottom:16px;display:flex;align-items:center;gap:7px}
.dash-nav-btn{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:11px;background:rgba(12,17,24,.8);border:1px solid rgba(255,255,255,.07);color:#D8EAF8;font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .2s;margin-bottom:8px;width:100%;text-align:left}
.dash-nav-btn:hover{border-color:rgba(59,158,255,.4);background:rgba(59,158,255,.07);color:#3B9EFF}
.dash-nav-btn-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.activity-item{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.activity-text{font-size:12px;line-height:1.55;color:rgba(216,234,248,.7)}
.activity-time{font-size:10px;color:rgba(216,234,248,.3);margin-top:3px}
.progress-bar-wrap{margin-bottom:12px}
.progress-bar-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.progress-bar-bg{background:rgba(255,255,255,.06);border-radius:6px;height:6px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:6px;transition:width .8s ease}
@media(max-width:900px){.dash-row{grid-template-columns:1fr}}

/* ── ANALYTICS SCREEN ── */
.analytics-wrap{min-height:100vh;background:#070A0F;padding-top:64px}
.analytics-content{max-width:1320px;margin:0 auto;padding:40px 24px}
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.chart-card{background:rgba(16,24,32,.7);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:22px}
.chart-title{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:rgba(216,234,248,.4);margin-bottom:4px}
.chart-val{font-family:'Fira Code',monospace;font-size:28px;font-weight:700;margin-bottom:16px}
.bar-chart{display:flex;gap:6px;align-items:flex-end;height:100px}
.bar-col{flex:1;border-radius:5px 5px 0 0;min-height:4px;transition:opacity .2s;cursor:pointer}
.bar-col:hover{opacity:.75}
.bar-labels{display:flex;gap:6px;margin-top:6px}
.bar-label{flex:1;font-size:8px;text-align:center;color:rgba(216,234,248,.35);letter-spacing:.5px}
.line-chart-svg{width:100%;overflow:visible}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.donut-legend-item{display:flex;align-items:center;gap:8px;font-size:11px}
.donut-legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.export-bar{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.export-btn{padding:9px 18px;border-radius:9px;background:rgba(16,24,32,.8);border:1px solid rgba(255,255,255,.1);color:rgba(216,234,248,.7);font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.export-btn:hover{border-color:rgba(59,158,255,.4);color:#3B9EFF;background:rgba(59,158,255,.07)}
.filter-bar{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.filter-btn{padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(12,17,24,.8);color:rgba(216,234,248,.5);font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s}
.filter-btn.active{background:rgba(59,158,255,.15);border-color:rgba(59,158,255,.4);color:#3B9EFF}
.metric-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.metric-box{padding:16px;border-radius:12px;background:rgba(16,24,32,.7);border:1px solid rgba(255,255,255,.06)}

/* ── ADMIN SCREEN ── */
.admin-wrap{min-height:100vh;background:#070A0F;padding-top:64px}
.admin-content{max-width:1320px;margin:0 auto;padding:40px 24px}
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:20px}
.admin-sidebar{background:rgba(16,24,32,.7);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:16px;height:fit-content}
.admin-sidebar-title{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(216,234,248,.3);margin-bottom:12px;padding:0 6px}
.admin-nav-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;border:none;background:transparent;color:rgba(216,234,248,.5);font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;width:100%;text-align:left;margin-bottom:3px}
.admin-nav-btn:hover,.admin-nav-btn.active{background:rgba(59,158,255,.1);color:#3B9EFF}
.admin-main{background:rgba(16,24,32,.7);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:24px}
.admin-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.admin-search{flex:1;min-width:200px;padding:9px 14px;background:rgba(12,17,24,.9);border:1px solid rgba(255,255,255,.09);border-radius:9px;color:#D8EAF8;font-family:'Outfit',sans-serif;font-size:13px;outline:none}
.admin-search::placeholder{color:rgba(216,234,248,.25)}
.admin-search:focus{border-color:rgba(59,158,255,.4)}
.admin-add-btn{padding:9px 18px;border-radius:9px;background:linear-gradient(135deg,#3B9EFF,#00D4C8);color:#070A0F;font-weight:800;font-size:12px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;white-space:nowrap}
.user-table{width:100%;border-collapse:collapse}
.user-table th{padding:9px 14px;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:rgba(216,234,248,.3);border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
.user-table td{padding:12px 14px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
.user-table tr:hover td{background:rgba(255,255,255,.02)}
.user-avatar{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.role-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.admin-action-btn{padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(216,234,248,.5);font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;cursor:pointer;transition:all .2s;margin-left:4px}
.admin-action-btn:hover{color:#D8EAF8;border-color:rgba(255,255,255,.25)}
.admin-action-btn.danger:hover{color:#FF5050;border-color:rgba(255,80,80,.4)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px}
.modal-card{background:#101820;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:32px;width:100%;max-width:460px;animation:fadeUp .25s ease both}
.modal-title{font-size:16px;font-weight:900;margin-bottom:20px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.modal-cancel{padding:9px 20px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(216,234,248,.6);font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.modal-save{padding:9px 22px;border-radius:9px;background:linear-gradient(135deg,#3B9EFF,#00D4C8);color:#070A0F;font-weight:800;font-size:13px;border:none;cursor:pointer;font-family:'Outfit',sans-serif}
.admin-select{width:100%;padding:11px 13px;background:rgba(12,17,24,.9);border:1px solid rgba(255,255,255,.09);border-radius:9px;color:#D8EAF8;font-family:'Outfit',sans-serif;font-size:13px;outline:none;-webkit-appearance:none}
.admin-select:focus{border-color:rgba(59,158,255,.4)}
@media(max-width:900px){.admin-layout{grid-template-columns:1fr}}
</style>

function AuthScreen({onLogin}){
  const [tab,setTab]=useState("login");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [name,setName]=useState("");
  const [role,setRole]=useState("Viewer");
  const [err,setErr]=useState("");
  const [success,setSuccess]=useState("");
  const [loading,setLoading]=useState(false);

  const handleLogin=()=>{
    setErr(""); setSuccess("");
    if(!email||!pass){setErr("Please enter email and password.");return;}
    const user=DEMO_USERS.find(u=>u.email===email&&u.password===pass);
    if(!user){setErr("Invalid credentials. Try a demo account below.");return;}
    setLoading(true);
    setTimeout(()=>{setLoading(false);onLogin(user);},900);
  };
  const handleRegister=()=>{
    setErr(""); setSuccess("");
    if(!name||!email||!pass){setErr("All fields are required.");return;}
    if(!email.includes("@")){setErr("Enter a valid email address.");return;}
    if(pass.length<6){setErr("Password must be at least 6 characters.");return;}
    setLoading(true);
    setTimeout(()=>{
      setLoading(false);
      setSuccess("Account created! You can now log in.");
      setTab("login");
    },800);
  };
  const quickLogin=(u)=>{setEmail(u.email);setPass(u.password);setErr("");};

  return(
    <div className="auth-wrap">
      <div className="auth-bg-orb" style={{width:500,height:500,background:"radial-gradient(circle,rgba(59,158,255,.12),transparent)",top:-100,left:-100}}/>
      <div className="auth-bg-orb" style={{width:400,height:400,background:"radial-gradient(circle,rgba(167,139,250,.1),transparent)",bottom:-80,right:-80}}/>
      <div className="auth-card fade-up">
        <div className="auth-logo">
          <div className="auth-logo-icon">🎗</div>
          <div>
            <div style={{fontWeight:900,fontSize:17,color:"#D8EAF8"}}>OncoBio Global</div>
            <div style={{fontSize:10,color:"rgba(216,234,248,.35)",letterSpacing:1.2}}>ANTICANCER BIOSIMILAR PLATFORM</div>
          </div>
        </div>
        <div className="auth-tabs">
          <button className={`auth-tab ${tab==="login"?"active":""}`} onClick={()=>{setTab("login");setErr("");setSuccess("");}}>Sign In</button>
          <button className={`auth-tab ${tab==="register"?"active":""}`} onClick={()=>{setTab("register");setErr("");setSuccess("");}}>Register</button>
        </div>
        {err&&<div className="auth-error">⚠ {err}</div>}
        {success&&<div className="auth-success">✓ {success}</div>}
        {tab==="register"&&(
          <div className="auth-field">
            <label className="auth-label">Full Name</label>
            <input className="auth-input" type="text" placeholder="Dr. Firstname Lastname" value={name} onChange={e=>setName(e.target.value)}/>
          </div>
        )}
        <div className="auth-field">
          <label className="auth-label">Email Address</label>
          <input className="auth-input" type="email" placeholder="you@oncobio.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(tab==="login"?handleLogin():handleRegister())}/>
        </div>
        <div className="auth-field">
          <label className="auth-label">Password</label>
          <input className="auth-input" type="password" placeholder={tab==="register"?"Min. 6 characters":"••••••••"} value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(tab==="login"?handleLogin():handleRegister())}/>
        </div>
        {tab==="register"&&(
          <div className="auth-field">
            <label className="auth-label">Role</label>
            <select className="auth-input admin-select" value={role} onChange={e=>setRole(e.target.value)}>
              <option>Viewer</option><option>Analyst</option><option>Manager</option>
            </select>
          </div>
        )}
        <button className="auth-btn" onClick={tab==="login"?handleLogin:handleRegister} disabled={loading} style={{opacity:loading?.6:1}}>
          {loading?(tab==="login"?"Authenticating…":"Creating Account…"):(tab==="login"?"Sign In →":"Create Account →")}
        </button>
        <div className="auth-divider">quick demo access</div>
        <div className="auth-demo" style={{flexWrap:"wrap"}}>
          <button className="auth-demo-btn" onClick={()=>quickLogin(DEMO_USERS[0])} style={{borderColor:"rgba(59,158,255,.3)",color:"#3B9EFF"}}>👤 Admin Login</button>
          <button className="auth-demo-btn" onClick={()=>quickLogin(DEMO_USERS[1])}>📊 Analyst Login</button>
          <button className="auth-demo-btn" onClick={()=>quickLogin(DEMO_USERS[2])}>💼 Manager Login</button>
        </div>
        <div style={{textAlign:"center",marginTop:18,fontSize:11,color:"rgba(216,234,248,.2)"}}>
          Protected by enterprise-grade encryption · OncoBio Global © 2025
        </div>
      </div>
    </div>
  );
}

          {/* Molecule revenue split */}

              {["2025","2026","2027","2028","2029","2030","2031","2032"].map((y,i)=>(
                <text key={y} x={i*(280/7)} y="88" fill="rgba(216,234,248,.3)" fontSize="8" textAnchor="middle">{y}</text>
              ))}
            </svg>
          </div>

          {/* Regulatory tracker */}
          <div className="chart-card">
            <div className="chart-title">⚖ Regulatory Pipeline</div>
            <div className="chart-val" style={{color:C.purple,fontSize:18}}>9 Markets</div>

              {market:"Health Canada",status:"Parallel Track",mol:"Trastuzumab",color:C.teal,pct:25},
              {market:"Saudi SFDA",status:"Pre-Submission",mol:"Rituximab · Trastuzumab",color:C.green,pct:15},
              {market:"Indonesia BPOM",status:"Assessment",mol:"Bevacizumab",color:C.purple,pct:10},
              {market:"Brazil ANVISA",status:"Planned",mol:"Trastuzumab · Bevacizumab",color:C.amber,pct:5},

              <div key={r.market} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>

                    <div style={{fontSize:9,color:"rgba(216,234,248,.35)"}}>{r.mol}</div>

              {risk:"Patent Litigation",sev:"HIGH",imp:82,color:C.red},
              {risk:"US Section 232 Tariff",sev:"HIGH",imp:75,color:C.red},
              {risk:"GMP Facility Warning",sev:"MED",imp:55,color:C.amber},
              {risk:"Tender Loss (Brazil/IDN)",sev:"MED",imp:50,color:C.amber},
              {risk:"Cold Chain Excursion",sev:"MED",imp:42,color:C.amber},
              {risk:"PD-1 Patent Thicket",sev:"MED",imp:38,color:C.amber},
              {risk:"Currency Volatility",sev:"LOW",imp:22,color:C.green},

}

/* ════════════════════ ADMIN SCREEN ════════════════════ */
function AdminScreen({currentUser}){
  const [section,setSection]=useState("users");
  const [users,setUsers]=useState(DEMO_USERS);
  const [search,setSearch]=useState("");
  const [showModal,setShowModal]=useState(false);
  const [editUser,setEditUser]=useState(null);
  const [form,setForm]=useState({name:"",email:"",role:"Viewer",dept:"",status:"active"});
  const [deleteId,setDeleteId]=useState(null);
  const isAdmin=currentUser.role==="Super Admin";

  const filtered=users.filter(u=>
    u.name.toLowerCase().includes(search.toLowerCase())||
    u.email.toLowerCase().includes(search.toLowerCase())||
    u.role.toLowerCase().includes(search.toLowerCase())
  );

  const openAdd=()=>{setEditUser(null);setForm({name:"",email:"",role:"Viewer",dept:"",status:"active"});setShowModal(true);};
  const openEdit=(u)=>{setEditUser(u);setForm({name:u.name,email:u.email,role:u.role,dept:u.dept,status:u.status});setShowModal(true);};
  const saveUser=()=>{
    if(!form.name||!form.email)return;
    if(editUser){
      setUsers(prev=>prev.map(u=>u.id===editUser.id?{...u,...form}:u));
    }else{
      const cols=["#3B9EFF","#00D4C8","#A78BFA","#FFB020","#00E27A","#FF5050","#F472B6"];
      setUsers(prev=>[...prev,{id:Date.now(),...form,password:"NewUser@123",joined:new Date().toISOString().slice(0,10),last:"Just now",avatar:form.name.split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase(),color:cols[prev.length%cols.length]}]);
    }
    setShowModal(false);
  };
  const confirmDelete=(id)=>setDeleteId(id);
  const doDelete=()=>{setUsers(prev=>prev.filter(u=>u.id!==deleteId));setDeleteId(null);};
  const toggleStatus=(id)=>setUsers(prev=>prev.map(u=>u.id===id?{...u,status:u.status==="active"?"inactive":"active"}:u));

  const roleColors={
    "Super Admin":C.red,"Manager":C.blue,"Analyst":C.cyan,"Viewer":C.green
  };
  const sideNav=[
    {id:"users",icon:"👥",label:"User Management"},
    {id:"roles",icon:"🔐",label:"Roles & Permissions"},
    {id:"settings",icon:"⚙️",label:"Platform Settings"},
    {id:"audit",icon:"📋",label:"Audit Log"},
    {id:"security",icon:"🛡",label:"Security"},
  ];

  return(
    <div className="admin-wrap">
      <div className="admin-content">
        <div style={{marginBottom:24}} className="fade-up">
          <div style={{fontSize:10,fontWeight:800,letterSpacing:2,color:C.purple,textTransform:"uppercase",marginBottom:6}}>Admin Panel</div>
          <h1 style={{fontSize:"clamp(20px,2.5vw,32px)",fontWeight:900,marginBottom:4}}>User & <span className="grad-text">Platform Management</span></h1>
          <p style={{fontSize:13,color:"rgba(216,234,248,.4)"}}>Manage users, roles, permissions and platform settings.</p>
        </div>

        <div className="admin-layout">
          {/* Sidebar */}
          <div>
            <div className="admin-sidebar">
              <div className="admin-sidebar-title">Navigation</div>
              {sideNav.map(n=>(
                <button key={n.id} className={`admin-nav-btn ${section===n.id?"active":""}`} onClick={()=>setSection(n.id)}>
                  <span>{n.icon}</span>{n.label}
                </button>
              ))}
            </div>
            <div className="admin-sidebar" style={{marginTop:12}}>
              <div className="admin-sidebar-title">Overview</div>
              {[{label:"Total Users",val:users.length,color:C.blue},
                {label:"Active",val:users.filter(u=>u.status==="active").length,color:C.green},
                {label:"Inactive",val:users.filter(u=>u.status==="inactive").length,color:C.red},
                {label:"Admins",val:users.filter(u=>u.role==="Super Admin").length,color:C.purple},
              ].map(s=>(
                <div key={s.label} style={{display:"flex",justifyContent:"space-between",padding:"7px 6px",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
                  <span style={{fontSize:12,color:"rgba(216,234,248,.45)"}}>{s.label}</span>
                  <span style={{fontSize:13,fontWeight:700,color:s.color,fontFamily:"'Fira Code',monospace"}}>{s.val}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Main content */}
          <div className="admin-main">
            {section==="users"&&(
              <>
                <div className="admin-toolbar">
                  <input className="admin-search" placeholder="🔍  Search users by name, email or role…" value={search} onChange={e=>setSearch(e.target.value)}/>
                  {isAdmin&&<button className="admin-add-btn" onClick={openAdd}>+ Add User</button>}
                </div>
                <div style={{overflowX:"auto"}}>
                  <table className="user-table">
                    <thead>
                      <tr>
                        <th>User</th><th>Role</th><th>Department</th><th>Status</th><th>Last Active</th><th>Joined</th>{isAdmin&&<th>Actions</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {filtered.map(u=>(
                        <tr key={u.id}>
                          <td>
                            <div style={{display:"flex",alignItems:"center",gap:10}}>
                              <div className="user-avatar" style={{background:`${u.color}20`,color:u.color}}>{u.avatar}</div>
                              <div>
                                <div style={{fontWeight:700,fontSize:13}}>{u.name}</div>
                                <div style={{fontSize:10,color:"rgba(216,234,248,.35)"}}>{u.email}</div>
                              </div>
                            </div>
                          </td>
                          <td><span className="role-badge" style={{background:`${roleColors[u.role]||C.blue}18`,color:roleColors[u.role]||C.blue,border:`1px solid ${roleColors[u.role]||C.blue}30`}}>{u.role}</span></td>
                          <td style={{color:"rgba(216,234,248,.55)",fontSize:12}}>{u.dept}</td>
                          <td>
                            <span style={{cursor:isAdmin?"pointer":"default"}} onClick={()=>isAdmin&&toggleStatus(u.id)}>
                              <span className="status-dot" style={{background:u.status==="active"?C.green:C.red}}/>
                              <span style={{fontSize:11,color:u.status==="active"?C.green:C.red,fontWeight:600}}>{u.status==="active"?"Active":"Inactive"}</span>
                            </span>
                          </td>
                          <td style={{fontSize:11,color:"rgba(216,234,248,.4)"}}>{u.last}</td>
                          <td style={{fontSize:11,color:"rgba(216,234,248,.4)",fontFamily:"'Fira Code',monospace"}}>{u.joined}</td>
                          {isAdmin&&(
                            <td>
                              <button className="admin-action-btn" onClick={()=>openEdit(u)}>Edit</button>
                              {u.id!==currentUser.id&&<button className="admin-action-btn danger" onClick={()=>confirmDelete(u.id)}>Delete</button>}
                            </td>
                          )}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  {filtered.length===0&&<div style={{textAlign:"center",padding:"40px",color:"rgba(216,234,248,.3)",fontSize:14}}>No users found matching "{search}"</div>}
                </div>
              </>
            )}

            {section==="roles"&&(
              <div>
                <div style={{fontWeight:800,fontSize:16,marginBottom:20}}>Roles & Permissions</div>

                  {role:"Manager",color:C.blue,perms:["Business plan view & edit","Analytics view","Dashboard access","No user management"]},
                  {role:"Analyst",color:C.cyan,perms:["Business plan view","Analytics view","Export CSV","No admin access"]},
                  {role:"Viewer",color:C.green,perms:["Business plan view only","Dashboard read-only","No export","No analytics edit"]},
                ].map(r=>(
                  <div key={r.role} style={{background:"rgba(12,17,24,.7)",border:`1px solid ${r.color}30`,borderRadius:12,padding:"16px 18px",marginBottom:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                      <span className="role-badge" style={{background:`${r.color}18`,color:r.color,border:`1px solid ${r.color}30`,padding:"5px 14px",fontSize:12}}>{r.role}</span>
                      <span style={{fontSize:11,color:"rgba(216,234,248,.3)"}}>{users.filter(u=>u.role===r.role).length} user(s)</span>

                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>

                    </div>
                  </div>
                ))}
              </div>
            )}

            {section==="settings"&&(

                <div style={{fontWeight:800,fontSize:16,marginBottom:20}}>Platform Settings</div>
                {[
                  {section:"Branding",items:[{label:"Platform Name",val:"OncoBio Global"},{label:"Theme",val:"Dark (Default)"},{label:"Language",val:"English"}]},
                  {section:"Security",items:[{label:"Session Timeout",val:"8 hours"},{label:"2FA Enforcement",val:"Admins only"},{label:"Password Policy",val:"Min 8 chars + special"}]},
                  {section:"Notifications",items:[{label:"Email Alerts",val:"Enabled"},{label:"Milestone Reminders",val:"Weekly"},{label:"Regulatory Updates",val:"Instant"}]},
                ].map(s=>(
                  <div key={s.section} style={{background:"rgba(12,17,24,.7)",border:"1px solid rgba(255,255,255,.07)",borderRadius:12,padding:"16px 18px",marginBottom:12}}>
                    <div style={{fontSize:11,fontWeight:800,letterSpacing:1.5,color:"rgba(216,234,248,.4)",textTransform:"uppercase",marginBottom:12}}>{s.section}</div>

                      <div key={it.label} style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:"1px solid rgba(255,255,255,.05)",fontSize:13}}>

                        <span style={{color:"#D8EAF8",fontWeight:600}}>{it.val}</span>

                  {user:"Priya Nair",action:"Submitted Health Canada pre-filing form",time:"May 3, 2024",type:"edit",color:C.cyan},
                ].map((l,i)=>(
                  <div key={i} style={{display:"flex",gap:12,padding:"11px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>

                    <div style={{flex:1}}>
                      <div style={{fontSize:12,fontWeight:700,color:"rgba(216,234,248,.8)"}}>{l.user} <span style={{color:`${l.color}`,background:`${l.color}15`,border:`1px solid ${l.color}25`,borderRadius:4,padding:"1px 6px",fontSize:9,fontWeight:700,marginLeft:4}}>{l.type.toUpperCase()}</span></div>

            <div className="auth-field">
              <label className="auth-label">Role</label>
              <select className="auth-input admin-select" value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))}>
                <option>Super Admin</option><option>Manager</option><option>Analyst</option><option>Viewer</option>
              </select>
            </div>
            <div className="auth-field">
              <label className="auth-label">Status</label>
              <select className="auth-input admin-select" value={form.status} onChange={e=>setForm(p=>({...p,status:e.target.value}))}>
                <option value="active">Active</option><option value="inactive">Inactive</option>
              </select>
            </div>
            <div className="modal-footer">
              <button className="modal-cancel" onClick={()=>setShowModal(false)}>Cancel</button>
              <button className="modal-save" onClick={saveUser}>{editUser?"Save Changes":"Add User"}</button>
            </div>
          </div>
        </div>
      )}

      {/* Delete confirm modal */}
      {deleteId&&(
        <div className="modal-overlay" onClick={()=>setDeleteId(null)}>
          <div className="modal-card" style={{maxWidth:380}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:32,marginBottom:12}}>🗑</div>
            <div className="modal-title">Delete User?</div>
            <div style={{fontSize:13,color:"rgba(216,234,248,.5)",marginBottom:8}}>This action cannot be undone. The user will lose all access to OncoBio Global.</div>
            <div className="modal-footer">
              <button className="modal-cancel" onClick={()=>setDeleteId(null)}>Cancel</button>
              <button className="modal-save" style={{background:"linear-gradient(135deg,#FF5050,#FF8080)"}} onClick={doDelete}>Delete</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════ GLOBAL NAV (auth-aware) ════════════════════ */
function AppNav({user,screen,onNav,onLogout}){
  const screens=[
    {id:"dashboard",label:"Dashboard",icon:"🏠"},
    {id:"main",label:"Business Plan",icon:"🔬"},
    {id:"analytics",label:"Analytics",icon:"📊"},
    {id:"admin",label:"Admin",icon:"⚙️"},
  ];
  return(
    <nav>
      <div className="nav-inner">
        <a className="nav-logo" href="#" onClick={e=>{e.preventDefault();onNav("dashboard");}}>
          <div className="nav-logo-icon">🎗</div>
          <div>
            <div className="nav-logo-text">OncoBio Global</div>
            <div className="nav-logo-sub">ANTICANCER BIOSIMILAR</div>
          </div>
        </a>
        <div className="nav-links">
          {screens.map(s=>(
            <button key={s.id} className={`nav-link ${screen===s.id?"active":""}`} onClick={()=>onNav(s.id)}>{s.icon} {s.label}</button>
          ))}
        </div>
        {user&&(
          <div style={{display:"flex",alignItems:"center",gap:10,marginLeft:"auto"}}>
            <div style={{width:32,height:32,borderRadius:9,background:`${user.color}20`,color:user.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800}}>{user.avatar}</div>
            <div style={{display:"flex",flexDirection:"column"}}>
              <span style={{fontSize:11,fontWeight:700,color:"rgba(216,234,248,.8)"}}>{user.name.split(" ")[0]}</span>
              <span style={{fontSize:9,color:"rgba(216,234,248,.35)"}}>{user.role}</span>
            </div>
            <button className="nav-link" onClick={onLogout} style={{marginLeft:4}}>Sign Out</button>
          </div>
        )}
      </div>
    </nav>
  );
}

/* ════════════════════ ROOT APP ════════════════════ */
function App(){
  const [user,setUser]=useState(null);
  const [screen,setScreen]=useState("auth");

  const handleLogin=(u)=>{setUser(u);setScreen("dashboard");};
  const handleLogout=()=>{setUser(null);setScreen("auth");};
  const navigate=(s)=>setScreen(s);

  if(screen==="auth") return <AuthScreen onLogin={handleLogin}/>;

  return(
    <>
      <AppNav user={user} screen={screen} onNav={navigate} onLogout={handleLogout}/>
      {screen==="dashboard"&&<DashboardScreen user={user} onNav={navigate}/>}
      {screen==="main"&&<Website embedded={true}/>}
      {screen==="analytics"&&<AnalyticsScreen/>}
      {screen==="admin"&&<AdminScreen currentUser={user}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
