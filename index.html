  const appRef=useRef(null);

  useEffect(()=>{
    const h=()=>setScrolled(window.scrollY>40);
    window.addEventListener("scroll",h);
    return()=>window.removeEventListener("scroll",h);
  },[]);

  const scrollToApp=()=>{
    if(appRef.current) appRef.current.scrollIntoView({behavior:"smooth",block:"start"});
  };

  return(
    <>
      {/* ── NAV ── */}
      <nav style={{background:scrolled?"rgba(7,10,15,.97)":"rgba(7,10,15,.7)"}}>
        <div className="nav-inner">
          <a className="nav-logo" href="#" onClick={e=>{e.preventDefault();window.scrollTo({top:0,behavior:"smooth"})}}>

            <div>
              <div className="nav-logo-text">OncoBio Global</div>
              <div className="nav-logo-sub">ANTICANCER BIOSIMILAR STRATEGY</div>
            </div>
          </a>
          <div className="nav-links">
            {[["Strategy","#strategy"],["Molecules","#molecules"],["Markets","#markets"],["Timeline","#timeline"]].map(([l,h])=>(
              <a key={l} className="nav-link" href={h}>{l}</a>
            ))}
            <a className="nav-link" href="#" onClick={e=>{e.preventDefault();scrollToApp()}}>Interactive Plan</a>
          </div>
          <button className="nav-cta" onClick={scrollToApp}>Open Full Plan →</button>
        </div>
      </nav>

      {/* ── HERO ── */}
      <div className="hero grid-bg">
        {/* Decorative blobs */}
        <div style={{position:"absolute",top:"15%",left:"10%",width:400,height:400,borderRadius:"50%",background:"radial-gradient(circle,rgba(59,158,255,.06),transparent 70%)",pointerEvents:"none"}}/>
        <div style={{position:"absolute",bottom:"20%",right:"8%",width:350,height:350,borderRadius:"50%",background:"radial-gradient(circle,rgba(0,226,122,.06),transparent 70%)",pointerEvents:"none"}}/>
        <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:700,height:700,borderRadius:"50%",background:"radial-gradient(circle,rgba(167,139,250,.03),transparent 60%)",pointerEvents:"none"}}/>

        <div className="fade-up" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"6px 16px",borderRadius:100,background:"rgba(59,158,255,.1)",border:"1px solid rgba(59,158,255,.25)",fontSize:11,fontWeight:700,color:"#3B9EFF",letterSpacing:.8,marginBottom:24}}>
          <span style={{width:6,height:6,borderRadius:"50%",background:"#3B9EFF",animation:"pulse 2s infinite",display:"inline-block"}}/>
          GLOBAL BUSINESS PLAN · 2025–2032
        </div>

        <h1 className="hero-title fade-up-d1">
          The <span className="grad-text">Anticancer Biosimilar</span><br/>
          Global Opportunity
        </h1>

        <p className="hero-sub fade-up-d2">
          Six oncology mAb biosimilars. Seven priority markets. Near-zero import tariff. 8–12% effective group tax.
          A structured strategy to capture the $18B → $45B oncology biosimilar market by 2030.
        </p>

        <div className="hero-ctas fade-up-d3">
          <button className="btn-primary" onClick={scrollToApp}>Explore Interactive Plan</button>
          <a className="btn-secondary" href="#strategy">Read Strategy Overview</a>
        </div>

        <div className="stats-bar fade-up-d4">
          {[{val:"$45B",lbl:"Market by 2030",color:"#00E27A"},{val:"6",lbl:"Target Molecules",color:"#3B9EFF"},{val:"7",lbl:"Priority Markets",color:"#FFB020"},{val:"400M+",lbl:"Addressable Patients",color:"#A78BFA"},{val:"~0%",lbl:"Import Tariff (SEZ→GCC)",color:"#00D4C8"},{val:"8-12%",lbl:"Effective Group Tax",color:"#FFD700"}].map(s=>(
            <div key={s.lbl} className="stat-item">
              <div className="stat-val" style={{color:s.color}}>{s.val}</div>
              <div className="stat-lbl">{s.lbl}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── STRATEGY SECTION ── */}
      <div className="divider"/>
      <section id="strategy">
        <div style={{textAlign:"center",marginBottom:56}}>
          <div className="section-tag" style={{color:C.blue,textAlign:"center"}}>STRATEGIC FRAMEWORK</div>
          <h2 className="section-title" style={{textAlign:"center",margin:"0 auto 16px"}}>Six Pillars of <span className="grad-text">Structural Advantage</span></h2>
          <p className="section-sub" style={{margin:"0 auto"}}>Every pillar delivers a defensible moat that global pharma giants cannot replicate without restructuring their entire supply chains and IP holding structures.</p>
        </div>
        <div className="feature-grid">
          {[{n:"01",icon:"🏭",t:"India-SEZ COGS Moat",d:"Manufacture at 55-65% lower cost than EU/US peers using CHO cell lines in Hyderabad SEZ — 0% corporate tax for 5 years, 5% input tariff. Structural advantage no multinational can replicate.",c:"#3B9EFF"},{n:"02",icon:"🚢",t:"JAFZA Tariff-Zero Hub",d:"Re-export via Jebel Ali Free Zone: 0% import duty, 0% export duty, 0% corporate tax (50-year guarantee). One GCC registration unlocks 6 countries and 175+ destinations duty-free.",c:"#00E27A"},{n:"03",icon:"📋",t:"EMA Master Key",d:"EMA anticancer biosimilar approval unlocks Saudi SFDA, UAE MOHAP, Canada, Brazil ANVISA, Japan PMDA and 30+ WHO-reliant regulators at 60-70% lower subsequent regulatory cost.",c:"#FFB020"},{n:"04",icon:"🔓",t:"Cetuximab Blue Ocean",d:"No EMA-approved cetuximab biosimilar exists as of 2025. Our CHO-produced biosim avoids glycosylation patent AND is clinically safer. First-to-file EMA = 24-36 month exclusive window.",c:"#F472B6"},{n:"05",icon:"⚡",t:"SUS + JKN Tender Monopoly",d:"Brazil SUS (40M+ oncology patients) + Indonesia JKN (250M citizens). Win one government tender, supply an entire nation. India COGS wins vs. Amgen/Pfizer by 30-40% price margin.",c:"#00D4C8"},{n:"06",icon:"🧬",t:"PD-1 2030 Pioneer",d:"Pembrolizumab ($25B) + nivolumab ($8.8B) face patent cliffs 2028-2032. Begin analytical characterization now. First filer wins $8-15B combined biosimilar market by 2030-2035.",c:"#A78BFA"}].map(s=>(
            <div key={s.n} className="feature-card hover-lift">
              <div className="feature-card-num" style={{color:s.c}}>{s.n}</div>
              <div className="feature-icon">{s.icon}</div>
              <div className="feature-title" style={{color:s.c}}>{s.t}</div>
              <div className="feature-desc">{s.d}</div>
            </div>
          ))}
        </div>
      </section>

      {/* ── MOLECULES SECTION ── */}
      <div className="divider"/>
      <section id="molecules">
        <div style={{marginBottom:40}}>
          <div className="section-tag" style={{color:C.green}}>TARGET PORTFOLIO</div>
          <h2 className="section-title">Six Oncology <span className="grad-text">mAb Biosimilars</span></h2>
          <p className="section-sub">Three immediate-entry molecules with fully expired core patents, two pipeline molecules with EU patent expiry by 2026, and one long-term 2030 position in the checkpoint inhibitor space.</p>
        </div>
        <div className="molecule-grid">
          {MOLECULES.map(m=>(
            <div key={m.name} className="molecule-card hover-lift" style={{borderTop:`3px solid ${m.color}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <div>
                  <div style={{fontWeight:800,fontSize:16,color:m.color}}>{m.name}</div>
                  <div style={{fontSize:11,color:"rgba(216,234,248,.45)"}}>{m.brand} · {m.company}</div>
                </div>
                <Tag label={m.priority} color={m.color}/>
              </div>
              <div style={{fontSize:12,color:"rgba(216,234,248,.6)",marginBottom:10,lineHeight:1.55}}>{m.indication}</div>
              <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderTop:"1px solid rgba(255,255,255,.06)"}}>
                <span style={{fontSize:10,color:"rgba(216,234,248,.35)"}}>PEAK SALES</span>
                <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:m.color,fontWeight:600}}>{m.origSales}</span>
              </div>
              <div style={{padding:"6px 0",borderTop:"1px solid rgba(255,255,255,.06)",fontSize:11,color:"rgba(216,234,248,.5)",lineHeight:1.55}}>{m.opportunity.slice(0,100)}…</div>
            </div>
          ))}
        </div>
      </section>

      {/* ── MARKETS SECTION ── */}
      <div className="divider"/>
      <section id="markets">
        <div style={{marginBottom:40}}>
          <div className="section-tag" style={{color:C.amber}}>COUNTRY MATRIX</div>
          <h2 className="section-title">Seven Priority <span className="grad-text-amber">Markets</span></h2>
          <p className="section-sub">Each market selected for a unique structural advantage — combining tariff architecture, tax optimization, regulatory pathway speed, and market opportunity into a global flywheel.</p>
        </div>
        <div className="market-grid">
          {COUNTRIES.map(c=>(
            <div key={c.name} className="market-card hover-lift" style={{borderTop:`3px solid ${c.color}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:24}}>{c.flag}</span>
                  <div>
                    <div style={{fontWeight:800,fontSize:14,color:c.color}}>{c.name}</div>
                    <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(216,234,248,.35)"}}>TIER {c.tier}</div>
                  </div>
                </div>
              </div>
              <div style={{fontSize:11,color:"rgba(216,234,248,.45)",marginBottom:10,lineHeight:1.55}}>{c.role}</div>
              {[{l:"FTO",v:c.rating.fto},{l:"Tax",v:c.rating.tax},{l:"Regulatory",v:c.rating.regulatory},{l:"Market",v:c.rating.market}].map(r=>(
                <div key={r.l} style={{display:"flex",alignItems:"center",gap:7,marginBottom:4}}>
                  <span style={{fontSize:9,color:"rgba(216,234,248,.35)",width:60}}>{r.l}</span>
                  <div style={{flex:1,background:"rgba(255,255,255,.05)",borderRadius:3,height:4}}>
                    <div style={{width:`${r.v}%`,height:"100%",background:c.color,borderRadius:3}}/>
                  </div>
                  <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:c.color,width:28,textAlign:"right"}}>{r.v}</span>
                </div>
              ))}
              <div style={{marginTop:10,padding:"8px 0",borderTop:"1px solid rgba(255,255,255,.06)",fontSize:10,color:"rgba(216,234,248,.4)",lineHeight:1.6}}>{c.usp.slice(0,80)}…</div>
            </div>
          ))}
        </div>
      </section>

      {/* ── TIMELINE ── */}
      <div className="divider"/>
      <section id="timeline">
        <div style={{marginBottom:40}}>
          <div className="section-tag" style={{color:C.purple}}>EXECUTION ROADMAP</div>
          <h2 className="section-title">From IND to <span className="grad-text">Global Revenue</span></h2>
          <p className="section-sub">A phased execution plan from India GMP setup through EMA approval, multi-market tender wins, and PD-1 pipeline launch — targeting breakeven by Year 3.5.</p>
        </div>
        <div className="timeline" style={{maxWidth:740}}>
          {[{year:"2025",label:"Foundation & Development",color:"#3B9EFF",items:["India SEZ GMP facility lease (Hyderabad CDMO, WHO-prequalified)","Netherlands BV incorporation — Innovation Box tax setup","UAE JAFZA Pharma Zone registration — 0% duty logistics hub","EMA Scientific Advice meetings for trastuzumab + rituximab","Initiate CHO cell line development for cetuximab (blue ocean)"]},{year:"2026",label:"Dossier Build & EMA Submission",color:"#00D4C8",items:["Trastuzumab biosim: complete analytical similarity package","Rituximab biosim: submit EMA MAA (Marketing Authorization Application)","Canada Health Canada: parallel dossier submission (trastuzumab)","Saudi SFDA pre-submission meeting (contingent on EMA filing)","Cetuximab: IND filing in EU, India, Canada"]},{year:"2027",label:"First Approvals & Tender Launch",color:"#00E27A",items:["EMA positive opinion: rituximab biosim (first approved)","Canada NOC/c: rituximab — 12/13 provinces mandate switch activated","Saudi NUPCO tender bid: rituximab + trastuzumab portfolio bundle","Indonesia BPOM dossier submission (ASEAN-India FTA = 0% tariff)","Pertuzumab: EMA biosim dossier submission (EU patent expiry 2025-26)"]},{year:"2028-2029",label:"Scale & Portfolio Expansion",color:"#FFB020",items:["EMA trastuzumab approval → Canada pCPA listing → provincial lock-in","Brazil ANVISA fast-track approval (comparability pathway via EMA)","SUS tender bid: trastuzumab + bevacizumab bundle — LatAm passport","Cetuximab EU launch: FIRST EMA-approved cetuximab biosim — premium pricing","Indonesia JKN formulary listing: full oncology mAb portfolio"]},{year:"2030-2032",label:"PD-1 Horizon & Profitability",color:"#A78BFA",items:["Nivolumab biosim EMA approval (patent expiry 2030)","Pembrolizumab IND filing — $25B market pipeline entry","Full GCC portfolio: 6 molecules, 6 countries, single JAFZA hub","Group revenue: $600M-1.2B cumulative; 42-52% net margin","India Section 3(d) + Brazil compulsory license: early PD-1 market entry"]}].map((ph,i)=>(
            <div key={ph.year} className="timeline-item">
              <div className="timeline-dot" style={{borderColor:ph.color,color:ph.color}}>{i+1}</div>
              <div style={{background:"rgba(16,24,32,.6)",border:`1px solid ${ph.color}30`,borderRadius:12,padding:"16px 18px",marginBottom:4}}>
                <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:10}}>
                  <span style={{fontFamily:"'Fira Code',monospace",fontSize:14,fontWeight:700,color:ph.color}}>{ph.year}</span>
                  <span style={{fontWeight:800,fontSize:14}}>{ph.label}</span>
                </div>
                {ph.items.map(item=>(
                  <div key={item} style={{display:"flex",gap:8,fontSize:12,color:"rgba(216,234,248,.65)",marginBottom:5,lineHeight:1.55}}>
                    <span style={{color:ph.color,flexShrink:0}}>→</span>{item}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* ── INTERACTIVE PLAN ── */}
      <div className="divider"/>
      <div ref={appRef} style={{background:"rgba(12,17,24,.5)",borderTop:"1px solid rgba(255,255,255,.06)",borderBottom:"1px solid rgba(255,255,255,.06)",padding:"60px 0"}}>
        <div style={{maxWidth:1320,margin:"0 auto",padding:"0 24px"}}>
          <div style={{textAlign:"center",marginBottom:32}}>
            <div className="section-tag" style={{color:C.blue,textAlign:"center"}}>INTERACTIVE BUSINESS PLAN</div>
            <h2 className="section-title" style={{textAlign:"center",margin:"0 auto 12px"}}>Explore the Full <span className="grad-text">Strategic Detail</span></h2>
            <p style={{fontSize:14,color:"rgba(216,234,248,.45)",textAlign:"center"}}>Navigate 9 modules: molecule FTO analysis, competitive intelligence, country matrix, regulatory pathways, supply chain, financials, risk playbook, and more.</p>
          </div>
          <AppPanel/>
        </div>
      </div>

      {/* ── CTA BANNER ── */}
      <section style={{padding:"80px 24px",textAlign:"center",background:"linear-gradient(135deg,rgba(59,158,255,.05),rgba(0,226,122,.05))"}}>
        <div style={{maxWidth:640,margin:"0 auto"}}>
          <div style={{fontSize:11,fontWeight:800,letterSpacing:2,color:C.blue,textTransform:"uppercase",marginBottom:12}}>READY TO ENTER THE MARKET</div>
          <h2 style={{fontSize:"clamp(28px,4vw,44px)",fontWeight:900,lineHeight:1.1,marginBottom:16}}>The Patent Cliff Window<br/><span className="grad-text">Is Open Right Now</span></h2>
          <p style={{fontSize:15,color:"rgba(216,234,248,.5)",lineHeight:1.75,marginBottom:32}}>Trastuzumab, bevacizumab, rituximab core patents have already expired. Cetuximab EU patent expired 2024 with zero approved biosimilars. Every month of delay is market share permanently ceded to the next filer.</p>
          <div style={{display:"flex",gap:14,justifyContent:"center",flexWrap:"wrap"}}>
            <button className="btn-primary" onClick={scrollToApp}>Open Full Business Plan</button>
            <button className="btn-secondary" onClick={()=>window.scrollTo({top:0,behavior:"smooth"})}>Back to Top ↑</button>
          </div>
        </div>
      </section>

      {/* ── FOOTER ── */}
      <footer>
        <div className="footer-inner">
          <div className="footer-grid">
            <div>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                <div style={{width:36,height:36,borderRadius:9,background:"linear-gradient(135deg,#FF5050,#A78BFA)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>🎗</div>
                <div className="footer-logo">OncoBio Global</div>
              </div>
              <div className="footer-desc">Global anticancer biosimilar business plan — 6 molecules, 7 markets, near-zero tariff structure, 8-12% effective tax. FTO-cleared, EMA-first strategy for the $18B → $45B oncology biosimilar market.</div>
            </div>
            <div>
              <div className="footer-col-title">Molecules</div>
              {["Trastuzumab","Bevacizumab","Rituximab","Cetuximab","Pertuzumab","Nivolumab"].map(m=><span key={m} className="footer-link" onClick={scrollToApp}>{m}</span>)}
            </div>
            <div>
              <div className="footer-col-title">Markets</div>
              {["India","UAE / Dubai","Saudi Arabia","Indonesia","Brazil","EU / Germany","Canada"].map(m=><span key={m} className="footer-link" onClick={scrollToApp}>{m}</span>)}
            </div>
            <div>
              <div className="footer-col-title">Plan Sections</div>
              {["Strategy Overview","Competitive Analysis","Regulatory & FTO","Supply Chain","Unique Propositions","Financials","Risk Playbook"].map(m=><span key={m} className="footer-link" onClick={scrollToApp}>{m}</span>)}
            </div>
          </div>
          <div className="footer-bottom">
            <div className="footer-copy">© 2025 OncoBio Global · Anticancer Biosimilar Global Business Plan · 2025–2032</div>
            <div className="footer-copy">For strategic use only · FTO · Tax-Tariff Optimized</div>
          </div>
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Website/>);
</script>
